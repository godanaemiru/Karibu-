<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard | Karibu Groceries</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1b5e20; --accent: #fbc02d; --bg: #f4f6f8; --white: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--primary); color: var(--white); padding: 2rem; position: fixed; height: 100%; display: flex; flex-direction: column; }
        .brand { font-size: 1.5rem; margin-bottom: 3rem; display: flex; gap: 10px; align-items: center; color: var(--accent); font-weight: 600; }
        .nav-links { list-style: none; flex: 1; }
        .nav-links li { margin-bottom: 1rem; }
        .nav-links a { color: rgba(255,255,255,0.8); text-decoration: none; display: flex; gap: 12px; padding: 12px; border-radius: 8px; transition: 0.3s; cursor: pointer; }
        .nav-links a.active, .nav-links a:hover { background: rgba(255,255,255,0.15); color: var(--accent); }

        /* Main Content */
        .main-content { margin-left: 260px; flex: 1; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        
        .section { display: none; animation: fadeIn 0.4s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Cards & Forms */
        .card { background: var(--white); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 1rem; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; color: #555; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        .input-group input:focus { border-color: var(--primary); }

        .btn-submit { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 20px; }
        .btn-submit:hover { background: #144a17; }

        /* Stock Table */
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #f8f9fa; color: #666; font-size: 0.85rem; font-weight: 600; border-bottom: 2px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; color: #333; }
        tr:hover { background-color: #f1f8e9; }
        
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 500; }
        .badge-available { background: #e8f5e9; color: var(--primary); }
        .badge-out { background: #ffebee; color: #c62828; }

    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="brand"><i class="fas fa-leaf"></i> Karibu Manager</div>
        
        <ul class="nav-links">
            <li><a onclick="showSection('procurement')" id="nav-procurement" class="active"><i class="fas fa-truck-loading"></i> Procurement</a></li>
            <li><a onclick="showSection('stock')" id="nav-stock"><i class="fas fa-boxes"></i> Stock Level</a></li>
        </ul>

        <div style="margin-top: auto; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 1rem;">
            <p style="font-size: 0.85rem; opacity: 0.8;">Branch:</p>
            <p style="font-weight: 600; margin-bottom: 10px;" id="branchDisplay">Loading...</p>
            <button onclick="logout()" style="background:none; border:none; color: var(--accent); cursor:pointer; font-size: 0.9rem;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <main class="main-content">
        
        <div id="procurement" class="section active">
            <div class="header">
                <h2>Procure Produce (Stock In)</h2>
            </div>

            <div class="card">
                <h4 style="color: var(--primary); margin-bottom: 15px;"><i class="fas fa-plus-circle"></i> New Stock Entry</h4>
                <form id="procurementForm">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Produce Name</label>
                            <select id="pName" required>
                                <option value="" disabled selected>-- Select Produce --</option>
                                <option value="Maize">Maize</option>
                                <option value="Beans">Beans</option>
                                <option value="Soybeans">Soybeans</option>
                                <option value="Cowpeas">Cowpeas</option>
                                <option value="G-Nuts">G-Nuts</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Type (Variety)</label>
                            <input type="text" id="pType" placeholder="e.g. Yellow Dent" required minlength="2">
                        </div>
                        <div class="input-group">
                            <label>Tonnage (kg)</label>
                            <input type="number" id="pTonnage" placeholder="Min 100" required min="100">
                        </div>
                        <div class="input-group">
                            <label>Total Cost (UgX)</label>
                            <input type="number" id="pCost" placeholder="Min 10,000" required min="10000">
                        </div>
                        <div class="input-group">
                            <label>Dealer Name</label>
                            <input type="text" id="dName" placeholder="Supplier Name" required minlength="2">
                        </div>
                        <div class="input-group">
                            <label>Dealer Contact</label>
                            <input type="tel" id="dContact" placeholder="07..." required pattern="^07\d{8}$" title="Format: 0712345678">
                        </div>
                        <div class="input-group">
                            <label>Selling Price (per kg)</label>
                            <input type="number" id="sPrice" placeholder="Unit Price" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">Record Procurement</button>
                </form>
            </div>
        </div>

        <div id="stock" class="section">
            <div class="header">
                <h2>Current Stock Levels</h2>
            </div>

            <div class="card">
                <div class="table-header">
                    <h4 style="color: var(--primary);">Inventory for <span id="stockBranchName">...</span></h4>
                    <input type="text" id="searchBox" onkeyup="filterStock()" placeholder="Search produce or dealer..." 
                           style="padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 250px;">
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Produce</th>
                            <th>Type</th>
                            <th>Tonnage (kg)</th>
                            <th>Selling Price</th>
                            <th>Dealer</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // --- 1. INITIAL SETUP ---
        const branch = localStorage.getItem('branch') || 'Maganjo';
        const role = localStorage.getItem('role');

        // Security Check
        if(role !== 'manager') {
            alert("Access Denied: Managers Only");
            window.location.href = '/login.html';
        }

        document.getElementById('branchDisplay').innerText = branch;
        document.getElementById('stockBranchName').innerText = branch;

        // --- 2. NAVIGATION LOGIC ---
        function showSection(sectionId) {
            // Toggle Visibility
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            document.getElementById('nav-' + sectionId).classList.add('active');

            // Load Data if switching to Stock View
            if(sectionId === 'stock') loadStock();
        }

        // --- 3. PROCUREMENT FORM SUBMIT ---
        document.getElementById('procurementForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                produceName: document.getElementById('pName').value,
                type: document.getElementById('pType').value,
                tonnage: parseInt(document.getElementById('pTonnage').value),
                cost: parseInt(document.getElementById('pCost').value),
                dealerName: document.getElementById('dName').value,
                contact: document.getElementById('dContact').value,
                sellingPrice: parseInt(document.getElementById('sPrice').value),
                branch: branch,
                date: new Date(),
                status: 'Available'
            };

            try {
                const res = await fetch('/api/stock/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                if(res.ok) {
                    alert("Stock Added Successfully!");
                    e.target.reset(); // Clear form
                    showSection('stock'); // Switch to view result
                } else {
                    const err = await res.json();
                    alert("Error: " + err.message);
                }
            } catch (err) {
                console.error(err);
                alert("Server Error. Ensure backend is running.");
            }
        });

        // --- 4. LOAD & FILTER STOCK DATA ---
        let stockData = []; // Store globally for filtering

        async function loadStock() {
            const tbody = document.getElementById('stockTableBody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Loading...</td></tr>';

            try {
                // Fetch stock specifically for this branch
                const res = await fetch(`/api/stock?branch=${branch}`);
                stockData = await res.json();
                
                renderTable(stockData);
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Failed to load data</td></tr>';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('stockTableBody');
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No stock records found.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td><b>${item.produceName}</b></td>
                    <td>${item.type}</td>
                    <td>${item.tonnage.toLocaleString()}</td>
                    <td>UgX ${item.sellingPrice.toLocaleString()}</td>
                    <td>${item.dealerName} <br><small style="color:#777;">${item.contact}</small></td>
                    <td>
                        <span class="badge ${item.status === 'Available' ? 'badge-available' : 'badge-out'}">
                            ${item.status}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function filterStock() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = stockData.filter(item => 
                item.produceName.toLowerCase().includes(query) || 
                item.dealerName.toLowerCase().includes(query) ||
                item.type.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }
    </script>
   
</body>
</html>
