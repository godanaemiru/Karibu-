<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KGL ERP System</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- DataTables -->
<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  background: #f4f6f9;
  overflow-x: hidden;
}

#sidebar {
  width: 250px;
  height: 100vh;
  position: fixed;
  background: #1e3c72;
  color: white;
  transition: 0.3s;
}

#sidebar.collapsed {
  width: 70px;
}

#sidebar a {
  color: white;
  display: block;
  padding: 12px 20px;
  text-decoration: none;
}

#sidebar a:hover {
  background: #2a5298;
}

#content {
  margin-left: 250px;
  transition: 0.3s;
}

#content.expanded {
  margin-left: 70px;
}

.card-hover:hover {
  transform: translateY(-5px);
  transition: 0.3s;
}

.dark-mode {
  background: #121212 !important;
  color: white !important;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div id="sidebar">
  <h4 class="text-center mt-3">KGL ERP</h4>
  <hr>

  <a href="#" onclick="showSection('dashboardSection')"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="#" onclick="showSection('salesSection')"><i class="bi bi-cash-stack"></i> Sales</a>
  <a href="#" onclick="showSection('procurementSection')" id="managerMenu"><i class="bi bi-box-seam"></i> Procurement</a>
  <a href="#" onclick="showSection('stockSection')"><i class="bi bi-archive"></i> Stock</a>
  <a href="#" onclick="showSection('reportsSection')" id="directorMenu"><i class="bi bi-bar-chart"></i> Reports</a>
  <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<!-- Top Navbar -->
<nav class="navbar navbar-light bg-white shadow px-3" id="topNav">
  <button class="btn btn-outline-primary" onclick="toggleSidebar()">
    <i class="bi bi-list"></i>
  </button>

  <div>
    <span class="badge bg-primary" id="userRole"></span>
    <button class="btn btn-sm btn-dark ms-2" onclick="toggleDarkMode()">🌙</button>
  </div>
</nav>

<!-- Content -->
<div id="content" class="p-4">

  <!-- DASHBOARD -->
  <div id="dashboardSection">
    <div class="row g-4">

      <div class="col-md-4">
        <div class="card shadow card-hover text-center p-3">
          <h6>Total Revenue</h6>
          <h3 id="totalRevenue" class="text-success counter">0</h3>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow card-hover text-center p-3">
          <h6>Credit Outstanding</h6>
          <h3 id="totalCredit" class="text-danger counter">0</h3>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow card-hover text-center p-3">
          <h6>Low Stock Items</h6>
          <h3 id="lowStock" class="text-warning">0</h3>
        </div>
      </div>

    </div>

    <div class="card shadow mt-4 p-4">
      <h5>Sales Overview</h5>
      <canvas id="salesChart"></canvas>
    </div>
  </div>

  <!-- SALES TABLE -->
  <div id="salesSection" style="display:none;">
    <div class="card shadow p-4">
      <h5>Sales Records</h5>
      <table id="salesTable" class="table table-striped">
        <thead>
          <tr>
            <th>Produce</th>
            <th>Tonnage</th>
            <th>Amount</th>
            <th>Buyer</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- STOCK SECTION -->
  <div id="stockSection" style="display:none;">
    <div class="card shadow p-4">
      <h5>Stock Inventory</h5>
      <table id="stockTable" class="table table-bordered">
        <thead>
          <tr>
            <th>Produce</th>
            <th>Type</th>
            <th>Branch</th>
            <th>Quantity</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- REPORTS -->
  <div id="reportsSection" style="display:none;">
    <div class="card shadow p-4">
      <h5>Export Reports</h5>
      <button class="btn btn-success" onclick="exportTableToCSV('salesTable')">
        Export Sales to Excel
      </button>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3">
  <div id="toastMsg" class="toast align-items-center text-bg-success border-0">
    <div class="d-flex">
      <div class="toast-body" id="toastText"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
