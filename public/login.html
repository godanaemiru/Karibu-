<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KGL Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

<div class="card shadow-lg login-card p-4">
  <div class="text-center mb-3">
    <h3 class="fw-bold text-primary">Karibu Groceries LTD</h3>
    <p class="text-muted">Inventory & Sales System</p>
  </div>

  <div class="mb-3">
    <label class="form-label">Username</label>
    <input type="text" id="name" class="form-control" placeholder="Enter username">
  </div>

  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" id="password" class="form-control" placeholder="Enter password">
  </div>

  <button onclick="login(event)" class="btn btn-primary w-100">
    Login
  </button>

  <div class="text-center mt-3">
    <small class="text-muted">© 2026 KGL System</small>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
